name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/practicehub?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/practicehub?schema=public"
      NEXTAUTH_SECRET: "ci-secret-do-not-use-must-be-32-chars-long!!"
      AUTH_SECRET: "ci-secret-do-not-use-must-be-32-chars-long!!"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
